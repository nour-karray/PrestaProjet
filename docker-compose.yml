services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trainflow}
      MYSQL_USER: ${MYSQL_USER:-trainflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be configured}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be configured}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"

  trainflow-backend-python:
    build:
      context: ./backend-python
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-trainflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-trainflow}?charset=utf8mb4
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CV_STORAGE_DIR: /app/storage/cv
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      LOCAL_LLM_URL: ${LOCAL_LLM_URL_DOCKER:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-300}
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-4096}
      LOCAL_LLM_TEMPERATURE: ${LOCAL_LLM_TEMPERATURE:-0}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./storage:/app/storage
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  trainflow-backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-trainflow}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-trainflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be configured}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SPRING_BACKEND_HOST_PORT:-8080}:8080"

  trainflow-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      trainflow-backend-python:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  mysql_data:
