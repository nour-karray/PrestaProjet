[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trainflow"
version = "0.1.0"
description = "Backend API for the AI-assisted Training Management Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "email-validator==2.2.0",
  "fastapi==0.139.2",
  "pyjwt==2.10.1",
  "pymysql==1.1.2",
  "pydantic-settings==2.10.1",
  "pypdf==5.9.0",
  "pwdlib[argon2]==0.2.1",
  "python-multipart==0.0.20",
  "reportlab==4.4.3",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.5",
  "types-reportlab==4.5.1.20260728",
]
migration = [
  "psycopg[binary]==3.2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = [
  "local_llm: optional integration test using the configured private local model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
