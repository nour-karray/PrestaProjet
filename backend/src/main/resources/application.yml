spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: TrainFlow AI
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:trainflow}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${MYSQL_USER:trainflow}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

server:
  port: 8080

trainflow:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth-cookie-secure: ${AUTH_COOKIE_SECURE:false}
  auth-cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  jwt:
    secret: ${JWT_SECRET}
    algorithm: ${JWT_ALGORITHM:HS256}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:7}
