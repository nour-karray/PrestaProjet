spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: TrainFlow AI
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trainflow}}
    username: ${POSTGRES_USER:trainflow}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    open-in-view: false
  sql:
    init:
      mode: never
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

server:
  port: 8080
